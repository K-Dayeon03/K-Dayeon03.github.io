<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spring Boot, Java, 협업과 테스트를 기록하는 강다연의 개발 공간." />
  <meta property="og:title" content="Dayeon Kang | Backend Developer" />
  <meta property="og:description" content="테트리스 블록처럼 쌓아가는 강다연의 백엔드 개발 기록." />
  <title>Dayeon Kang | Backend Developer</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;600;700;800&display=swap");
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

    :root {
      --paper: #faf8f3;
      --ink: #1a1a2e;
      --muted: #66656c;
      --grid: rgba(100, 120, 180, 0.12);
      --red: #e85d4a;
      --blue: #4a90d9;
      --green: #5cb85c;
      --purple: #9b59b6;
      --orange: #e67e22;
      --cyan: #1abc9c;
      --yellow: #f5c842;
      --pink: #e91e8c;
      --font-hand: "Caveat", cursive;
      --font-body: "Nunito", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-body);
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .wrap {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .floating-piece {
      position: fixed;
      pointer-events: none;
      opacity: 0.16;
      z-index: 0;
      animation: float 3.4s ease-in-out infinite;
    }

    .floating-piece.one {
      left: 3%;
      top: 9%;
      transform: rotate(15deg);
    }

    .floating-piece.two {
      right: 4%;
      top: 18%;
      transform: rotate(-10deg);
      animation-delay: 0.4s;
    }

    .floating-piece.three {
      left: 2%;
      bottom: 16%;
      transform: rotate(20deg);
      animation-delay: 0.8s;
    }

    .hero {
      padding: 44px 0 30px;
      text-align: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 8px 20px;
      color: var(--paper);
      background: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 10px;
      font-family: var(--font-hand);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0;
      transform: rotate(-1deg);
      filter: url(#sketchy);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      margin-top: 16px;
      font-family: var(--font-hand);
      font-size: clamp(3rem, 10vw, 4.7rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .handle {
      color: var(--red);
    }

    .scribble {
      width: 190px;
      height: 16px;
      margin: 8px auto 17px;
    }

    .intro {
      max-width: 430px;
      margin: 0 auto;
      color: #55545c;
      font-size: 0.98rem;
      line-height: 1.7;
      word-break: keep-all;
    }

    .top-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .mini-button {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 6px 18px;
      border: 2px dashed var(--ink);
      border-radius: 10px;
      background: rgba(250, 248, 243, 0.85);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 1.02rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mini-button.primary {
      color: #fff;
      background: var(--red);
      border: 2px solid #8b2718;
      box-shadow: 3px 3px 0 #8b2718;
    }

    .mini-button.active {
      color: #fff;
      background: var(--ink);
      border-style: solid;
    }

    .link-board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      padding: 16px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(4px);
      filter: url(#sketchy);
    }

    .block-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      min-height: 142px;
      padding: 14px 10px;
      text-align: center;
      user-select: none;
      border-radius: 14px;
      transition: transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1), filter 150ms ease;
    }

    .block-card:hover,
    .block-card:focus-visible {
      transform: translate(-2px, -3px) rotate(-1.5deg) scale(1.04);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.22));
      outline: none;
    }

    .link-board.edit-mode .block-card {
      position: relative;
      border: 2px dashed currentColor;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
    }

    .link-board.edit-mode .block-card::after {
      content: "✏️ 블록 편집";
      margin-top: 6px;
      color: var(--red);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .tetro {
      --cell: 24px;
      --block: var(--red);
      --shadow: #b83a29;
      --border: #8b2718;
      position: relative;
      display: block;
      width: calc(var(--cell) * var(--cols, 4));
      height: calc(var(--cell) * var(--rows, 3));
      margin-bottom: 8px;
      filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.15));
    }

    .tetro i {
      position: absolute;
      width: calc(var(--cell) - 2px);
      height: calc(var(--cell) - 2px);
      border: 1.5px dashed var(--border);
      border-radius: 5px;
      background: var(--block);
      box-shadow:
        3px 3px 0 var(--shadow),
        inset 4px 4px 0 rgba(255, 255, 255, 0.22);
    }

    .shape-i { --cols: 4; --rows: 1; }
    .shape-i i:nth-child(1) { left: 0; top: 0; }
    .shape-i i:nth-child(2) { left: var(--cell); top: 0; }
    .shape-i i:nth-child(3) { left: calc(var(--cell) * 2); top: 0; }
    .shape-i i:nth-child(4) { left: calc(var(--cell) * 3); top: 0; }

    .shape-o { --cols: 2; --rows: 2; }
    .shape-o i:nth-child(1) { left: 0; top: 0; }
    .shape-o i:nth-child(2) { left: var(--cell); top: 0; }
    .shape-o i:nth-child(3) { left: 0; top: var(--cell); }
    .shape-o i:nth-child(4) { left: var(--cell); top: var(--cell); }

    .shape-t { --cols: 3; --rows: 2; }
    .shape-t i:nth-child(1) { left: 0; top: 0; }
    .shape-t i:nth-child(2) { left: var(--cell); top: 0; }
    .shape-t i:nth-child(3) { left: calc(var(--cell) * 2); top: 0; }
    .shape-t i:nth-child(4) { left: var(--cell); top: var(--cell); }

    .shape-s { --cols: 3; --rows: 2; }
    .shape-s i:nth-child(1) { left: var(--cell); top: 0; }
    .shape-s i:nth-child(2) { left: calc(var(--cell) * 2); top: 0; }
    .shape-s i:nth-child(3) { left: 0; top: var(--cell); }
    .shape-s i:nth-child(4) { left: var(--cell); top: var(--cell); }

    .shape-z { --cols: 3; --rows: 2; }
    .shape-z i:nth-child(1) { left: 0; top: 0; }
    .shape-z i:nth-child(2) { left: var(--cell); top: 0; }
    .shape-z i:nth-child(3) { left: var(--cell); top: var(--cell); }
    .shape-z i:nth-child(4) { left: calc(var(--cell) * 2); top: var(--cell); }

    .shape-l { --cols: 2; --rows: 3; }
    .shape-l i:nth-child(1) { left: 0; top: 0; }
    .shape-l i:nth-child(2) { left: 0; top: var(--cell); }
    .shape-l i:nth-child(3) { left: 0; top: calc(var(--cell) * 2); }
    .shape-l i:nth-child(4) { left: var(--cell); top: calc(var(--cell) * 2); }

    .shape-j { --cols: 2; --rows: 3; }
    .shape-j i:nth-child(1) { left: var(--cell); top: 0; }
    .shape-j i:nth-child(2) { left: var(--cell); top: var(--cell); }
    .shape-j i:nth-child(3) { left: 0; top: calc(var(--cell) * 2); }
    .shape-j i:nth-child(4) { left: var(--cell); top: calc(var(--cell) * 2); }

    .label {
      color: var(--border);
      font-family: var(--font-hand);
      font-size: 1.22rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .desc {
      display: block;
      margin-top: 2px;
      color: #666;
      font-size: 0.76rem;
      line-height: 1.35;
      word-break: keep-all;
    }

    .score-footer {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      width: fit-content;
      margin: 44px auto 50px;
      padding: 10px 24px;
      color: var(--paper);
      background: var(--ink);
      border-radius: 12px;
      font-family: var(--font-hand);
      font-size: 1.08rem;
      filter: url(#sketchy);
      transform: rotate(0.5deg);
    }

    .score-footer strong {
      color: var(--yellow);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(26, 26, 46, 0.55);
      backdrop-filter: blur(4px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(100%, 420px);
      padding: 26px 22px 22px;
      border: 3px solid var(--ink);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 6px 6px 0 var(--ink);
      filter: url(#sketchy);
    }

    .modal h2 {
      margin: 0 0 18px;
      font-family: var(--font-hand);
      font-size: 1.8rem;
      line-height: 1;
    }

    .field {
      display: grid;
      gap: 5px;
      margin-bottom: 13px;
    }

    .field label {
      color: #444;
      font-family: var(--font-hand);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 40px;
      padding: 8px 11px;
      border: 2px solid #c9c5bc;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--ink);
      box-shadow: 2px 2px 0 rgba(26, 26, 46, 0.16);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions button {
      min-height: 42px;
      cursor: pointer;
    }

    .modal-actions .mini-button {
      justify-content: center;
      flex: 1;
    }

    .modal-actions .cancel {
      flex: 0 0 auto;
      background: #fff;
    }

    .modal-actions .delete {
      display: none;
      flex: 0 0 auto;
      color: var(--red);
      background: #fff;
      border-color: var(--red);
      border-style: solid;
    }

    .modal.editing .modal-actions .delete {
      display: inline-flex;
    }

    .game-backdrop {
      position: fixed;
      inset: 0;
      z-index: 18;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(26, 26, 46, 0.62);
      backdrop-filter: blur(4px);
    }

    .game-backdrop.open {
      display: flex;
    }

    .game-panel {
      width: min(100%, 520px);
      padding: 20px;
      border: 3px solid var(--ink);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 7px 7px 0 var(--ink);
      filter: url(#sketchy);
    }

    .game-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .game-head h2 {
      margin: 0;
      font-family: var(--font-hand);
      font-size: 1.75rem;
      line-height: 1;
    }

    .game-score {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      color: #55545c;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 132px;
      gap: 14px;
      align-items: start;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 3px;
      aspect-ratio: 10 / 14;
      padding: 8px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        #10101f;
      background-size: 24px 24px;
    }

    .game-cell {
      min-width: 0;
      min-height: 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .game-cell.filled,
    .game-cell.active {
      background: var(--cell-color);
      border-color: var(--cell-border);
      box-shadow:
        inset 4px 4px 0 rgba(255, 255, 255, 0.22),
        2px 2px 0 var(--cell-shadow);
      cursor: pointer;
    }

    .game-cell.active {
      opacity: 0.9;
    }

    .game-side {
      display: grid;
      gap: 9px;
    }

    .game-now {
      min-height: 78px;
      padding: 10px;
      border: 2px dashed var(--ink);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.62);
      text-align: center;
    }

    .game-now strong {
      display: block;
      color: var(--red);
      font-family: var(--font-hand);
      font-size: 1.1rem;
      line-height: 1.1;
    }

    .game-now span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.3;
      word-break: keep-all;
    }

    .game-controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .game-controls .mini-button {
      justify-content: center;
      min-height: 38px;
      padding-inline: 8px;
      font-size: 0.95rem;
    }

    .game-message {
      min-height: 38px;
      color: #55545c;
      font-size: 0.78rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -6px; }
    }

    @media (max-width: 520px) {
      .wrap {
        width: min(100% - 24px, 720px);
      }

      .hero {
        padding-top: 34px;
      }

      .link-board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 12px;
      }

      .block-card {
        min-height: 132px;
        padding: 12px 4px;
      }

      .tetro {
        --cell: 21px;
      }

      .label {
        font-size: 1.08rem;
      }

      .game-layout {
        grid-template-columns: 1fr;
      }

      .game-side {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;">
      <defs>
        <filter id="sketchy">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <span class="floating-piece one tetro shape-i" style="--block: var(--red); --shadow:#b83a29; --border:#8b2718;" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="floating-piece two tetro shape-o" style="--block: var(--blue); --shadow:#2d6fab; --border:#1a4e7e;" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="floating-piece three tetro shape-t" style="--block: var(--green); --shadow:#3d8b3d; --border:#236223;" aria-hidden="true"><i></i><i></i><i></i><i></i></span>

    <main class="wrap">
      <header class="hero" id="top">
        <span class="tag">🎮 다연이의 개발 공간</span>
        <h1>안녕, 나는<br><span class="handle">@K-Dayeon03</span> 이야</h1>
        <svg class="scribble" viewBox="0 0 190 16" aria-hidden="true">
          <path d="M4 11 Q48 4 95 9 Q143 14 186 7" stroke="#e85d4a" stroke-width="4" fill="none" stroke-linecap="round" />
        </svg>
        <p class="intro">
          Spring Boot와 Java를 중심으로 서비스 구조, API, 테스트, 협업 기록을 블록처럼 차곡차곡 쌓아갑니다.
        </p>
        <div class="top-actions">
          <button class="mini-button" id="open-game" type="button">🎮 블록 게임하기</button>
          <button class="mini-button primary" id="open-add-modal" type="button">＋ 블록 추가</button>
          <button class="mini-button" id="toggle-edit-mode" type="button">✏️ 블록 편집</button>
          <a class="mini-button" href="https://github.com/K-Dayeon03" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
      </header>

      <nav class="link-board" id="link-board" aria-label="주요 링크"></nav>

      <footer class="score-footer">
        <span>BLOCKS: <strong id="block-count">02</strong></span>
        <span>LEVEL: <strong>01</strong></span>
        <span>STACK: <strong>SPRING</strong></span>
      </footer>
    </main>

    <div class="modal-backdrop" id="add-modal" aria-hidden="true">
      <form class="modal" id="add-block-form">
        <h2 id="modal-title">🧩 새 블록 추가</h2>
        <div class="field">
          <label for="block-label">제목 *</label>
          <input id="block-label" name="label" type="text" placeholder="예: Velog" required />
        </div>
        <div class="field">
          <label for="block-url">링크 URL *</label>
          <input id="block-url" name="url" type="text" placeholder="https://..." required />
        </div>
        <div class="field">
          <label for="block-desc">설명</label>
          <input id="block-desc" name="description" type="text" placeholder="짧은 설명" />
        </div>
        <div class="field">
          <label for="block-emoji">아이콘</label>
          <input id="block-emoji" name="emoji" type="text" value="🔗" maxlength="4" />
        </div>
        <div class="field">
          <label for="block-color">색상</label>
          <select id="block-color" name="color">
            <option value="red">빨강</option>
            <option value="blue">파랑</option>
            <option value="green">초록</option>
            <option value="purple">보라</option>
            <option value="orange">주황</option>
            <option value="cyan">청록</option>
            <option value="yellow">노랑</option>
            <option value="pink">핑크</option>
          </select>
        </div>
        <div class="field">
          <label for="block-shape">블록 모양</label>
          <select id="block-shape" name="shape">
            <option value="shape-t">T</option>
            <option value="shape-l">L</option>
            <option value="shape-o">O</option>
            <option value="shape-s">S</option>
            <option value="shape-z">Z</option>
            <option value="shape-j">J</option>
            <option value="shape-i">I</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="mini-button primary" id="save-block" type="submit">추가하기 ✓</button>
          <button class="mini-button delete" id="delete-block" type="button">삭제</button>
          <button class="mini-button cancel" id="close-add-modal" type="button">취소</button>
        </div>
      </form>
    </div>

    <div class="game-backdrop" id="game-modal" aria-hidden="true">
      <section class="game-panel" aria-label="블록 게임 프로토타입">
        <div class="game-head">
          <div>
            <h2>🎮 Link Tetris</h2>
            <div class="game-score">
              <span>SCORE: <strong id="game-score">0</strong></span>
              <span>LINES: <strong id="game-lines">0</strong></span>
            </div>
          </div>
          <button class="mini-button" id="close-game" type="button">닫기</button>
        </div>
        <div class="game-layout">
          <div class="game-board" id="game-board" aria-label="게임 보드"></div>
          <aside class="game-side">
            <div class="game-now">
              <strong id="game-current-name">READY</strong>
              <span id="game-current-desc">내 블록들이 떨어집니다.</span>
            </div>
            <div class="game-controls">
              <button class="mini-button" id="game-left" type="button">←</button>
              <button class="mini-button" id="game-right" type="button">→</button>
              <button class="mini-button" id="game-rotate" type="button">↻</button>
              <button class="mini-button primary" id="game-drop" type="button">DROP</button>
            </div>
            <p class="game-message" id="game-message">
              방향키로 움직이고, 쌓인 블록 칸을 누르면 링크가 열립니다.
            </p>
          </aside>
        </div>
      </section>
    </div>
  </div>
  <script>
    const palette = {
      red: { block: "#e85d4a", shadow: "#b83a29", border: "#8b2718" },
      blue: { block: "#4a90d9", shadow: "#2d6fab", border: "#1a4e7e" },
      green: { block: "#5cb85c", shadow: "#3d8b3d", border: "#236223" },
      purple: { block: "#9b59b6", shadow: "#7d3d9c", border: "#5c2475" },
      orange: { block: "#e67e22", shadow: "#b85e0c", border: "#8a4000" },
      cyan: { block: "#1abc9c", shadow: "#0e8c72", border: "#056050" },
      yellow: { block: "#f5c842", shadow: "#c99e1a", border: "#9a7400" },
      pink: { block: "#e91e8c", shadow: "#b30060", border: "#7a003f" }
    };

    const defaultBlocks = [
      {
        label: "블로그 글",
        url: "https://dayeon03.tistory.com",
        description: "개발 기록",
        emoji: "✏️",
        color: "red",
        shape: "shape-t"
      },
      {
        label: "GitHub",
        url: "https://github.com/K-Dayeon03",
        description: "프로젝트 모음",
        emoji: "📝",
        color: "blue",
        shape: "shape-l"
      }
    ];

    const shapes = ["shape-t", "shape-l", "shape-o", "shape-s", "shape-z", "shape-j", "shape-i"];
    const board = document.querySelector("#link-board");
    const modal = document.querySelector("#add-modal");
    const form = document.querySelector("#add-block-form");
    const count = document.querySelector("#block-count");
    const modalBox = document.querySelector(".modal");
    const modalTitle = document.querySelector("#modal-title");
    const saveButton = document.querySelector("#save-block");
    const deleteButton = document.querySelector("#delete-block");
    const editToggle = document.querySelector("#toggle-edit-mode");
    const storageKey = "dayeon-tetris-blocks-v2";
    const legacyStorageKey = "dayeon-tetris-links";
    let editMode = false;
    let editingIndex = null;
    let blocks = loadBlocks();

    function normalizeUrl(url) {
      const trimmed = url.trim();
      if (/^(https?:|mailto:|tel:)/i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeShape(shape) {
      return shapes.includes(shape) ? shape : "shape-t";
    }

    function normalizeBlock(block) {
      return {
        label: String(block.label || "새 링크").trim(),
        url: normalizeUrl(String(block.url || "")),
        description: String(block.description || "추가한 링크").trim(),
        emoji: String(block.emoji || "🔗").trim() || "🔗",
        color: palette[block.color] ? block.color : "red",
        shape: safeShape(block.shape)
      };
    }

    function createBlockCard(block) {
      const colors = palette[block.color] || palette.red;
      const card = document.createElement("a");
      card.className = "block-card";
      card.href = normalizeUrl(block.url);
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.style.color = colors.border;
      card.style.setProperty("--border", colors.border);
      card.innerHTML = `
        <span class="tetro ${safeShape(block.shape)}" style="--block:${colors.block}; --shadow:${colors.shadow}; --border:${colors.border};" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="label">${escapeHtml(block.emoji || "🔗")} ${escapeHtml(block.label)}</span>
        <span class="desc">${escapeHtml(block.description || "추가한 링크")}</span>
      `;
      return card;
    }

    function readStorage(key) {
      try {
        return JSON.parse(localStorage.getItem(key)) || [];
      } catch {
        return [];
      }
    }

    function loadBlocks() {
      const saved = readStorage(storageKey);
      if (saved.length) return saved.map(normalizeBlock);

      const legacy = readStorage(legacyStorageKey);
      if (legacy.length) {
        return [...defaultBlocks, ...legacy].map(normalizeBlock);
      }

      return defaultBlocks.map(normalizeBlock);
    }

    function saveBlocks() {
      localStorage.setItem(storageKey, JSON.stringify(blocks));
    }

    function updateCount() {
      count.textContent = String(blocks.length).padStart(2, "0");
    }

    function renderBlocks() {
      board.innerHTML = "";
      blocks.forEach((block, index) => {
        const card = createBlockCard(block);
        card.dataset.index = index;
        card.addEventListener("click", (event) => {
          if (!editMode) return;
          event.preventDefault();
          openEditModal(index);
        });
        board.appendChild(card);
      });
      board.classList.toggle("edit-mode", editMode);
      updateCount();
    }

    function openModal(mode, index = null) {
      editingIndex = index;
      const isEdit = mode === "edit";
      modalBox.classList.toggle("editing", isEdit);
      modalTitle.textContent = isEdit ? "✏️ 블록 편집" : "🧩 새 블록 추가";
      saveButton.textContent = isEdit ? "저장하기 ✓" : "추가하기 ✓";

      if (isEdit) {
        const block = blocks[index];
        form.elements.label.value = block.label;
        form.elements.url.value = block.url;
        form.elements.description.value = block.description;
        form.elements.emoji.value = block.emoji;
        form.elements.color.value = block.color;
        form.elements.shape.value = block.shape;
      } else {
        form.reset();
        form.elements.emoji.value = "🔗";
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      form.elements.label.focus();
    }

    function openAddModal() {
      openModal("add");
    }

    function openEditModal(index) {
      openModal("edit", index);
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      form.reset();
      form.elements.emoji.value = "🔗";
      editingIndex = null;
      modalBox.classList.remove("editing");
    }

    renderBlocks();

    document.querySelector("#open-add-modal").addEventListener("click", openAddModal);
    editToggle.addEventListener("click", () => {
      editMode = !editMode;
      editToggle.classList.toggle("active", editMode);
      editToggle.textContent = editMode ? "✓ 블록 편집 완료" : "✏️ 블록 편집";
      renderBlocks();
    });
    document.querySelector("#close-add-modal").addEventListener("click", closeModal);
    deleteButton.addEventListener("click", () => {
      if (editingIndex === null) return;
      blocks.splice(editingIndex, 1);
      saveBlocks();
      renderBlocks();
      closeModal();
    });
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("open")) closeModal();
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const block = normalizeBlock({
        label: data.get("label"),
        url: data.get("url"),
        description: data.get("description"),
        emoji: data.get("emoji"),
        color: data.get("color"),
        shape: data.get("shape")
      });

      if (editingIndex === null) {
        blocks.push(block);
      } else {
        blocks[editingIndex] = block;
      }

      saveBlocks();
      renderBlocks();
      closeModal();
    });

    const gameModal = document.querySelector("#game-modal");
    const gameBoard = document.querySelector("#game-board");
    const gameScore = document.querySelector("#game-score");
    const gameLines = document.querySelector("#game-lines");
    const gameCurrentName = document.querySelector("#game-current-name");
    const gameCurrentDesc = document.querySelector("#game-current-desc");
    const gameMessage = document.querySelector("#game-message");
    const gameCols = 10;
    const gameRows = 14;
    const shapeCells = {
      "shape-i": [[0, 0], [0, 1], [0, 2], [0, 3]],
      "shape-o": [[0, 0], [0, 1], [1, 0], [1, 1]],
      "shape-t": [[0, 0], [0, 1], [0, 2], [1, 1]],
      "shape-s": [[0, 1], [0, 2], [1, 0], [1, 1]],
      "shape-z": [[0, 0], [0, 1], [1, 1], [1, 2]],
      "shape-l": [[0, 0], [1, 0], [2, 0], [2, 1]],
      "shape-j": [[0, 1], [1, 1], [2, 0], [2, 1]]
    };
    let gameGrid = [];
    let gameCells = [];
    let activePiece = null;
    let gameTimer = null;
    let score = 0;
    let lines = 0;
    let nextBlockIndex = 0;
    let gameOverNotified = false;

    function buildGameBoard() {
      gameBoard.innerHTML = "";
      gameCells = [];
      for (let row = 0; row < gameRows; row += 1) {
        for (let col = 0; col < gameCols; col += 1) {
          const cell = document.createElement("button");
          cell.className = "game-cell";
          cell.type = "button";
          cell.dataset.row = row;
          cell.dataset.col = col;
          cell.addEventListener("click", () => openCellLink(row, col));
          gameCells.push(cell);
          gameBoard.appendChild(cell);
        }
      }
    }

    function emptyGrid() {
      return Array.from({ length: gameRows }, () => Array.from({ length: gameCols }, () => null));
    }

    function rotatedCells(cells) {
      const rotated = cells.map(([row, col]) => [col, -row]);
      const minRow = Math.min(...rotated.map(([row]) => row));
      const minCol = Math.min(...rotated.map(([, col]) => col));
      return rotated.map(([row, col]) => [row - minRow, col - minCol]);
    }

    function activeCells(piece = activePiece) {
      if (!piece) return [];
      return piece.cells.map(([row, col]) => [piece.row + row, piece.col + col]);
    }

    function canPlace(piece) {
      return activeCells(piece).every(([row, col]) => (
        row >= 0 &&
        row < gameRows &&
        col >= 0 &&
        col < gameCols &&
        !gameGrid[row][col]
      ));
    }

    function spawnPiece() {
      if (!blocks.length) {
        gameMessage.textContent = "먼저 블록을 추가해 주세요.";
        return;
      }
      const block = blocks[nextBlockIndex % blocks.length];
      nextBlockIndex += 1;
      const cells = shapeCells[safeShape(block.shape)] || shapeCells["shape-t"];
      activePiece = {
        block,
        cells,
        row: 0,
        col: Math.floor(gameCols / 2) - 2
      };
      gameCurrentName.textContent = `${block.emoji} ${block.label}`;
      gameCurrentDesc.textContent = block.description || "쌓인 칸을 누르면 링크가 열립니다.";
      if (!canPlace(activePiece)) {
        clearInterval(gameTimer);
        gameTimer = null;
        activePiece = null;
        gameMessage.textContent = "GAME OVER · 다시 시작하면 보드가 초기화됩니다.";
        if (!gameOverNotified) {
          gameOverNotified = true;
          setTimeout(() => {
            alert(`게임 종료! 최종 점수는 ${score}점입니다. 지운 줄: ${lines}줄`);
          }, 50);
        }
      }
    }

    function lockPiece() {
      if (!activePiece) return;
      const colors = palette[activePiece.block.color] || palette.red;
      activeCells().forEach(([row, col]) => {
        if (row >= 0 && row < gameRows && col >= 0 && col < gameCols) {
          gameGrid[row][col] = {
            block: activePiece.block,
            color: colors.block,
            shadow: colors.shadow,
            border: colors.border
          };
        }
      });
      score += activeCells().length;
      clearLines();
      spawnPiece();
    }

    function clearLines() {
      let cleared = 0;
      gameGrid = gameGrid.filter((row) => {
        const full = row.every(Boolean);
        if (full) cleared += 1;
        return !full;
      });
      while (gameGrid.length < gameRows) {
        gameGrid.unshift(Array.from({ length: gameCols }, () => null));
      }
      if (cleared) {
        lines += cleared;
        gameMessage.textContent = `${cleared}줄 클리어!`;
      }
    }

    function movePiece(deltaRow, deltaCol) {
      if (!activePiece) return false;
      const next = { ...activePiece, row: activePiece.row + deltaRow, col: activePiece.col + deltaCol };
      if (canPlace(next)) {
        activePiece = next;
        drawGame();
        return true;
      }
      return false;
    }

    function rotatePiece() {
      if (!activePiece) return;
      const next = { ...activePiece, cells: rotatedCells(activePiece.cells) };
      if (canPlace(next)) {
        activePiece = next;
        drawGame();
      }
    }

    function hardDrop() {
      if (!activePiece) return;
      while (movePiece(1, 0)) {}
      lockPiece();
      drawGame();
    }

    function tickGame() {
      if (!activePiece) {
        spawnPiece();
      } else if (!movePiece(1, 0)) {
        lockPiece();
      }
      drawGame();
    }

    function drawGame() {
      const activeSet = new Set(activeCells().map(([row, col]) => `${row}:${col}`));
      const activeColors = activePiece ? (palette[activePiece.block.color] || palette.red) : null;
      gameCells.forEach((cell) => {
        const row = Number(cell.dataset.row);
        const col = Number(cell.dataset.col);
        const locked = gameGrid[row][col];
        const isActive = activeSet.has(`${row}:${col}`);
        cell.className = "game-cell";
        cell.style.removeProperty("--cell-color");
        cell.style.removeProperty("--cell-shadow");
        cell.style.removeProperty("--cell-border");

        if (locked) {
          cell.classList.add("filled");
          cell.style.setProperty("--cell-color", locked.color);
          cell.style.setProperty("--cell-shadow", locked.shadow);
          cell.style.setProperty("--cell-border", locked.border);
        } else if (isActive && activeColors) {
          cell.classList.add("active");
          cell.style.setProperty("--cell-color", activeColors.block);
          cell.style.setProperty("--cell-shadow", activeColors.shadow);
          cell.style.setProperty("--cell-border", activeColors.border);
        }
      });
      gameScore.textContent = score;
      gameLines.textContent = lines;
    }

    function openCellLink(row, col) {
      const locked = gameGrid[row]?.[col];
      if (!locked) return;
      window.open(normalizeUrl(locked.block.url), "_blank", "noopener,noreferrer");
    }

    function startGame() {
      buildGameBoard();
      gameGrid = emptyGrid();
      score = 0;
      lines = 0;
      nextBlockIndex = 0;
      gameOverNotified = false;
      activePiece = null;
      gameMessage.textContent = "방향키로 움직이고, 쌓인 블록 칸을 누르면 링크가 열립니다.";
      tickGame();
      clearInterval(gameTimer);
      gameTimer = setInterval(tickGame, 650);
    }

    function openGame() {
      alert("현재 가진 블록들로 게임이 진행됩니다.");
      gameModal.classList.add("open");
      gameModal.setAttribute("aria-hidden", "false");
      startGame();
    }

    function closeGame() {
      gameModal.classList.remove("open");
      gameModal.setAttribute("aria-hidden", "true");
      clearInterval(gameTimer);
      gameTimer = null;
    }

    document.querySelector("#open-game").addEventListener("click", openGame);
    document.querySelector("#close-game").addEventListener("click", closeGame);
    document.querySelector("#game-left").addEventListener("click", () => movePiece(0, -1));
    document.querySelector("#game-right").addEventListener("click", () => movePiece(0, 1));
    document.querySelector("#game-rotate").addEventListener("click", rotatePiece);
    document.querySelector("#game-drop").addEventListener("click", hardDrop);
    gameModal.addEventListener("click", (event) => {
      if (event.target === gameModal) closeGame();
    });
    window.addEventListener("keydown", (event) => {
      if (!gameModal.classList.contains("open")) return;
      if (event.key === "ArrowLeft") movePiece(0, -1);
      if (event.key === "ArrowRight") movePiece(0, 1);
      if (event.key === "ArrowDown") movePiece(1, 0);
      if (event.key === "ArrowUp") rotatePiece();
      if (event.key === " ") {
        event.preventDefault();
        hardDrop();
      }
    });
  </script>
</body>
</html>
